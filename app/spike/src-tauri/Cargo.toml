[package]
name = "si-spike"
version = "0.0.0"
description = "Throwaway Tauri shell for the step 3 stack spike"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-shell = "=2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
