# v2 engine: build and test on every OS we ship to, then hold the line on speed and memory by
# crawling a generated 100,000-page site. The benchmark fails the run if the crawl misses a planted
# issue, memory grows as the crawl grows, or throughput collapses, and then if any of the grids'
# reads of that crawl is slower than the UI's budget.
name: Engine (v2)

# Manual only, at the owner's word (2026-11-15): pushes used up GitHub minutes. Every check runs locally during
# development (docs/handoff/2026-11-13/tools/verify-engine.sh); run this from the Actions tab when preparing a release.
on:
  workflow_dispatch:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      # Warnings are errors, so the SDK is pinned to a feature band: a new band's analyzers arrive by choice, not
      # on an unrelated push. Bump it deliberately.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'

      # A hung test fails the run after 10 minutes, naming the test, instead of holding the runner for hours.
      - name: Test
        run: dotnet test ShoutingIguana.Engine.slnx -c Release --blame-hang-timeout 10m --blame-hang-dump-type none

  benchmark:
    name: 100k-page benchmark
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'

      - name: Build CLI
        run: dotnet build src/ShoutingIguana.Cli/ShoutingIguana.Cli.csproj -c Release

      # Thresholds leave headroom for a 4-core runner, which crawls ~1,100 pages/s with a ~190 MB peak and
      # ~40 bytes of growth per URL. A per-URL leak of a few hundred bytes, or a halving of speed, fails the run.
      - name: Crawl a generated 100,000-page site
        run: >
          dotnet src/ShoutingIguana.Cli/bin/Release/net10.0/si.dll bench
          --pages 100000 --concurrency 16
          --max-peak-mb 400 --max-growth-mb 100 --max-growth-bytes-per-url 250 --min-pages-per-sec 600
          --db bench.sicrawl --json bench.json

      # The grids' reads of that crawl, each on a fresh connection with nothing cached, as a filter set's first read is:
      # the URL grid's first page, the page half way down and the one just past it, for every sort, for filters common
      # and rare (up to three), text filters, regular expressions and search (common and rare), facets, the inspector
      # and its links, a check's groups and rows, and again without the URL summary. Each class of read is held to its
      # own p95 here, its growth from 100k URLs to 1M taken into account, so a read that would miss the UI's 1 s budget
      # at 1M fails at 100k (engine/README.md, Grid reads).
      - name: Read the crawl as the grids do
        run: >
          dotnet src/ShoutingIguana.Cli/bin/Release/net10.0/si.dll readbench bench.sicrawl
          --runs 20 --gate --json readbench.json

      # A smaller crawl with the links grid read all the while, a read always part-way through the file, as the Links
      # screen's reads of a running crawl are. SQLite can then never start the crawl's write-ahead log again by itself,
      # and the log grew by everything the crawl wrote, to more than the file. The crawl's writer folds it in once it
      # passes 64 MB: this fails if the log passes twice that, if a read of the links fails, or if the crawl whose log
      # was folded under it misses a planted issue. No memory limits: the reads' memory is the benchmark's own.
      - name: Crawl with the links grid read all the while
        run: >
          dotnet src/ShoutingIguana.Cli/bin/Release/net10.0/si.dll bench
          --pages 40000 --concurrency 16 --read-links --max-log-mb 128
          --json bench-read-links.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: |
            engine/bench.json
            engine/readbench.json
            engine/bench-read-links.json
