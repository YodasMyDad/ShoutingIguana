# v2 desktop app: static checks, unit tests and Storybook on every push; the end-to-end tests against the real
# sidecar, with axe, on Windows (the shipping target, and WebView2's engine family); and the Tauri shell: its tests,
# a release build, and a check that closing or killing the app leaves no sidecar behind.
name: App (v2)

# The app builds the engine's sidecar and CLI, so an engine change can break it too.
on:
  push:
    branches: [v2, 'ui/**']
    paths: ['app/**', '!app/spike/**', '!app/design/**', 'engine/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '!app/spike/**', '!app/design/**', 'engine/**', '.github/workflows/app.yml']
  workflow_dispatch:

jobs:
  checks:
    name: Lint, types, unit tests, Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The fixtures are git-ignored, so the stories that read them show their error state here: it still builds.
      - run: npm run build-storybook
      - run: npm run build

  e2e:
    name: End to end (Windows)
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Pinned to a feature band, as the engine's workflow does.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'

      - run: npm ci

      # The sidecar from this commit's engine; the global setup crawls the synthetic site with the CLI.
      - run: npm run build:sidecar -- --target x86_64-pc-windows-msvc
      - run: npx playwright install chromium
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  shell:
    name: Tauri shell (Windows)
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci

      # tauri-build needs the externalBin to exist before cargo can even test the crate.
      - run: npm run build:sidecar -- --target x86_64-pc-windows-msvc

      - name: Shell tests
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Release build (no installer)
        run: npm run tauri build -- --no-bundle

      - run: npx playwright install chromium

      # Closing the window, or killing the shell, leaves no sidecar running; the app shows a library in WebView2.
      - run: npm run check:orphans
      - run: npm run smoke:tauri
