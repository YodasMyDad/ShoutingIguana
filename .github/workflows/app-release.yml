# v2 desktop app release. One GitHub release gets every installer: Windows (per-user NSIS, x64), macOS (disk image,
# arm64 and x64) and Linux (.deb and .AppImage, x64). Each leg builds the sidecar and the shell. The version in the
# release title is the version in app/src-tauri/tauri.conf.json, so the tag has to be app-v plus that version.
#
# A push of a tag app-v* is the only thing that publishes. A push of a branch does not run this workflow. A run
# started by hand builds the installers, keeps them as artifacts, and cannot publish: the release job requires the
# tag push. app.yml and engine.yml stay manual.
#
# No certificates. Nothing reads the certificate secrets, and the signing step says so on the run summary. The
# Windows installer and the Linux packages are unsigned. The macOS app is ad-hoc signed (tauri.conf.json's
# signingIdentity "-"): no certificate is involved, and macOS still asks the user to allow it, but an app with no
# signature at all is refused outright on Apple silicon. macOS is cross-built from the arm64 runner for x64.
#
# Every leg smoke-tests the installer it built, and in each the packaged engine renders a page a script builds, which
# downloads Chromium as a user's first rendered crawl does (smoke-sidecar.mjs --render): a release whose installed
# engine can't start a browser fails here. Windows: scripts/smoke-installer.ps1 (install, the engine on its own,
# a run, uninstall). Linux: scripts/smoke-installer.sh in fresh containers, so what the runner has installed can't
# stand in for what the package depends on. macOS: the same script on the disk image, the x64 app under Rosetta.
# The macOS smoke test can't be tried on Windows. It first ran, and passed on both Macs, in the app-v2.1.0 run, and
# has been a hard failure since.
#
# Linux builds on ubuntu-22.04, the oldest runner, so the shell and the libraries the AppImage carries need glibc
# 2.35 and not 2.39: the AppImage then runs on Ubuntu 22.04, Debian 12 and later.
#
# The app updates itself from what this workflow publishes (app/src-tauri/src/updates.rs). Every leg builds with
# src-tauri/tauri.updater.conf.json, which turns the updater's artifacts on, and with the updater's signing key (the
# repository secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD; this is the updater's own
# minisign key, not a code-signing certificate). Each leg then holds what the app installs and its signature:
#   Windows   Shouting Iguana_<version>_x64-setup.exe      and .sig  (the installer itself)
#   macOS     Shouting Iguana_<version>_<arch>.app.tar.gz  and .sig  (the app, archived; the bundler names it
#             "Shouting Iguana.app.tar.gz" on both Macs, so it is renamed here with the disk image's arch)
#   Linux     Shouting Iguana_<version>_amd64.AppImage     and .sig  (the AppImage itself)
# The release job uploads them all, then writes latest.json (version, notes, pub_date, and for windows-x86_64,
# darwin-aarch64, darwin-x86_64 and linux-x86_64 the file's URL and its signature), checks it and uploads it last, so
# the app never reads a latest.json that names a file not yet there. The app asks for
# releases/latest/download/latest.json, so only a release GitHub marks latest updates anyone: a pre-release doesn't.
# The preflight job fails before any installer is built when a secret is missing or isn't the key the app trusts.
# What's new, as the app shows it, is app/release-notes/<version>.md when there is one.
name: App release (v2)

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Before any installer is built (a macOS minute costs ten Linux ones): the version is the same everywhere it is
  # written, a tag is this version's, and the updater's signing key is there and is the key the app trusts.
  preflight:
    name: Version and updater key
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: One version, and the tag is it
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          failed=0
          package="$(node -p "require('./package.json').version")"
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)"
          engine="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ../engine/Directory.Build.props | head -1)"
          for pair in "app/package.json=${package}" "app/src-tauri/Cargo.toml=${cargo}" "engine/Directory.Build.props=${engine}"; do
            if [ "${pair#*=}" != "$version" ]; then
              echo "::error::${pair%%=*} says version ${pair#*=}, and app/src-tauri/tauri.conf.json says ${version}."
              failed=1
            fi
          done
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "app-v${version}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} is not app-v${version}, app-v plus the version in app/src-tauri/tauri.conf.json."
            failed=1
          fi
          exit "$failed"

      - run: npm ci

      # Signs a small file as the build signs the installers, and checks the signature with the public key in
      # tauri.conf.json, as the app checks a download. Nothing of either secret is printed.
      - name: Updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::The repository secret ${name} is missing or empty. The app only installs an update signed with its updater key, so nothing is built without it."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          probe="${RUNNER_TEMP}/updater-key-probe.txt"
          echo "Shouting Iguana ${VERSION}" > "$probe"
          if ! npx tauri signer sign --app-version "$VERSION" "$probe" >/dev/null 2>"${RUNNER_TEMP}/updater-key-probe.log"; then
            echo "::error::Nothing could be signed with TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD. The first must be the key file's contents exactly (no line break added at its end), the second that key's password."
            exit 1
          fi
          if ! node scripts/updater-manifest.mjs verify "$probe" --version "$VERSION"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not the key whose public half is plugins.updater.pubkey in app/src-tauri/tauri.conf.json. The app would refuse every update signed with it."
            exit 1
          fi
          echo "### Updater key" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The updater's signing key is the one the app trusts. Version ${VERSION}." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            smoke: true
            signing: "Signing skipped: this installer is unsigned. Windows SmartScreen blocks it until it earns a reputation, and some managed machines will not run it at all."
            summary_extra: ""
          - id: macos-arm64
            name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            smoke: false
            signing: "No certificate: this build is ad-hoc signed and not notarised. Gatekeeper blocks it until it is allowed in Privacy and Security."
            summary_extra: ""
          - id: macos-x64
            name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            smoke: false
            signing: "No certificate: this build is ad-hoc signed and not notarised. Gatekeeper blocks it until it is allowed in Privacy and Security."
            summary_extra: ""
          - id: linux-x64
            name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            smoke: false
            signing: "Signing skipped: this build is unsigned. The .deb and the .AppImage are not signed."
            summary_extra: "The sidecar publish does not carry ICU, because the engine does not set InvariantGlobalization. Starting it aborts without the system's libicu. The .deb gets that library through WebKitGTK, and the .AppImage bundles it with WebKit. The .AppImage also carries libssl beside its libcrypto (tauri.conf.json), so the engine never pairs the system's libssl with the bundle's libcrypto."

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.4xx"

      # The same libraries the shell's Linux job links, plus patchelf, which the .deb and .AppImage bundlers need.
      - name: System packages
        if: matrix.id == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config build-essential patchelf file wget

      - name: Rust
        working-directory: app/src-tauri
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      # Said on the run summary, on every leg. The beta is unsigned on purpose: the certificate secrets are not
      # read, so scripts/sign.mjs skips, and this step does not ask for them.
      - name: Signing
        shell: bash
        run: |
          message="${{ matrix.signing }}"
          extra="${{ matrix.summary_extra }}"
          echo "::warning::${message}"
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "${message}"
            if [ -n "${extra}" ]; then
              echo ""
              echo "${extra}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - run: npm ci

      # No SI_SIGN_* variables. On Windows, sign.mjs logs that it skipped; the other platforms have nothing to sign.
      - name: Sidecar
        run: npm run build:sidecar -- --target ${{ matrix.target }}

      # APPIMAGE_EXTRACT_AND_RUN lets linuxdeploy's own AppImage run on a runner without FUSE. tauri.updater.conf.json
      # turns the updater's artifacts on: the build signs the installer (and the AppImage) with the updater's key, and
      # fails without it.
      - name: Release build
        if: runner.os != 'macOS'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.updater.conf.json

      # Ad-hoc signed (tauri.conf.json). If the signed bundle can't be made (codesign refusing the app or the sidecar
      # in it), the release still gets the unsigned bundle earlier releases shipped, and the summary says so. The
      # second build only bundles again: the compiling is done. The app bundle is built as well as the disk image,
      # because the updater's archive (Shouting Iguana.app.tar.gz) is made from it. --no-sign also skips the
      # updater's signature, so after that build the archive is signed by hand in the next step.
      - name: Release build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          if npm run tauri build -- --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.updater.conf.json; then
            exit 0
          fi
          message="The ad-hoc signed build failed, so this disk image was built again with --no-sign. The app in it has no signature: Apple silicon Macs call it damaged until its quarantine mark is removed (xattr -dr com.apple.quarantine)."
          echo "::warning::${message}"
          {
            echo "### ${{ matrix.name }}: not signed"
            echo ""
            echo "${message}"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"
          npm run tauri build -- --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.updater.conf.json --no-sign

      - name: Installer and checksum (Windows)
        id: installers-win
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "src-tauri\target\${{ matrix.target }}\release\bundle"
          if (-not (Test-Path -LiteralPath $root)) { throw "no bundle directory at $root" }
          $files = @()
          foreach ($kind in "${{ matrix.bundles }}".Split(",")) {
            $matches = switch ($kind) {
              "nsis" { Get-ChildItem -Path (Join-Path $root "nsis\*-setup.exe") -ErrorAction SilentlyContinue }
              "dmg" { Get-ChildItem -Path (Join-Path $root "dmg\*.dmg") -ErrorAction SilentlyContinue }
              "deb" { Get-ChildItem -Path (Join-Path $root "deb\*.deb") -ErrorAction SilentlyContinue }
              "appimage" { Get-ChildItem -Path (Join-Path $root "appimage\*.AppImage") -ErrorAction SilentlyContinue }
              default { throw "unknown bundle $kind" }
            }
            if (-not $matches) { throw "no $kind installer under $root" }
            $files += @($matches)
          }
          $out = Join-Path $env:RUNNER_TEMP "shouting-iguana-installers"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $lines = @(foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $out $file.Name) -Force
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          })
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          # The app updates from the installer itself: its signature, made by the build with the updater's key, goes
          # with it, and is checked here as the app checks it.
          $setup = $files | Where-Object { $_.Name -like "*-setup.exe" } | Select-Object -First 1
          if (-not $setup) { throw "no installer for the app to update from under $root" }
          $signature = "$($setup.FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) { throw "the build made no updater signature beside $($setup.Name)" }
          Copy-Item -LiteralPath $signature -Destination (Join-Path $out "$($setup.Name).sig") -Force
          node scripts/updater-manifest.mjs verify (Join-Path $out $setup.Name) --version $version
          if ($LASTEXITCODE -ne 0) { throw "the installer's updater signature is not good" }
          $sums = Join-Path $out "SHA256SUMS-${{ matrix.id }}.txt"
          Set-Content -LiteralPath $sums -Value $lines -Encoding ascii
          "dir=$out" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          $lines | ForEach-Object { Write-Host $_ }
          $nl = [Environment]::NewLine
          $fence = '```'
          $block = "### ${{ matrix.name }} checksums${nl}${nl}${fence}${nl}$($lines -join $nl)${nl}${fence}${nl}"
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $block, $utf8)

      - name: Installer and checksum
        id: installers-unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          root="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$root" ]; then
            echo "no bundle directory at $root" >&2
            exit 1
          fi
          shopt -s nullglob
          files=()
          IFS=',' read -r -a kinds <<< "${{ matrix.bundles }}"
          for kind in "${kinds[@]}"; do
            case "$kind" in
              nsis) matches=( "$root"/nsis/*-setup.exe ) ;;
              dmg) matches=( "$root"/dmg/*.dmg ) ;;
              deb) matches=( "$root"/deb/*.deb ) ;;
              appimage) matches=( "$root"/appimage/*.AppImage ) ;;
              # Not an installer: the updater's archive is made from it, below.
              app) continue ;;
              *) echo "unknown bundle $kind" >&2; exit 1 ;;
            esac
            if [ ${#matches[@]} -eq 0 ]; then
              echo "no $kind installer under $root" >&2
              exit 1
            fi
            files+=("${matches[@]}")
          done
          out="${RUNNER_TEMP}/shouting-iguana-installers"
          mkdir -p "$out"
          sums="$out/SHA256SUMS-${{ matrix.id }}.txt"
          : > "$sums"
          for file in "${files[@]}"; do
            cp "$file" "$out/"
            name="$(basename "$file")"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file" | awk -v name="$name" '{print $1 "  " name}' >> "$sums"
            else
              shasum -a 256 "$file" | awk -v name="$name" '{print $1 "  " name}' >> "$sums"
            fi
          done
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          # What the app updates from, with the signature the build made with the updater's key, each checked here as
          # the app checks it. On Linux that is the AppImage itself. On macOS it is the app, archived: the bundler names
          # the archive the same on both Macs, so it takes the disk image's name, which has the arch in it.
          update=""
          for file in "${files[@]}"; do
            case "$file" in
              *.AppImage)
                update="$out/$(basename "$file")"
                if [ ! -s "$file.sig" ]; then
                  echo "the build made no updater signature beside $(basename "$file")" >&2
                  exit 1
                fi
                cp "$file.sig" "$update.sig"
                ;;
              *.dmg)
                archives=( "$root"/macos/*.app.tar.gz )
                if [ ${#archives[@]} -ne 1 ]; then
                  echo "expected one .app.tar.gz for the app to update from under $root/macos, found ${#archives[@]}" >&2
                  exit 1
                fi
                update="$out/$(basename "${file%.dmg}").app.tar.gz"
                cp "${archives[0]}" "$update"
                if [ -s "${archives[0]}.sig" ]; then
                  cp "${archives[0]}.sig" "$update.sig"
                else
                  # The --no-sign build: it skips the updater's signature with the code signature.
                  echo "::warning::The build made no updater signature for the app archive (the --no-sign build): signing it now."
                  npx tauri signer sign --app-version "$version" "$update" >/dev/null
                fi
                name="$(basename "$update")"
                shasum -a 256 "$update" | awk -v name="$name" '{print $1 "  " name}' >> "$sums"
                ;;
            esac
          done
          if [ -z "$update" ]; then
            echo "nothing for the app to update from among: ${files[*]}" >&2
            exit 1
          fi
          node scripts/updater-manifest.mjs verify "$update" --version "$version"
          {
            echo "dir=${out}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          cat "$sums"
          {
            echo "### ${{ matrix.name }} checksums"
            echo ""
            echo '```'
            cat "$sums"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Each bundle in a fresh container, as root, with only a node binary added: apt installs the .deb with nothing
      # but its own dependencies, and the AppImage gets only the system libraries every desktop has. The oldest
      # distribution the README names, and a newer one with another OpenSSL and WebKitGTK.
      - name: Installer smoke test (Linux)
        if: matrix.id == 'linux-x64'
        shell: bash
        run: |
          set -uo pipefail
          installers="${{ steps.installers-unix.outputs.dir }}"
          node_home="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          failed=0
          for run in "deb ubuntu:22.04" "appimage ubuntu:22.04" "deb debian:13" "appimage debian:13"; do
            kind="${run%% *}"
            image="${run##* }"
            case "$kind" in
              deb) pattern='*.deb' ;;
              *) pattern='*.AppImage' ;;
            esac
            echo "::group::$kind on $image"
            log="${RUNNER_TEMP}/smoke-$kind-${image//[:.]/-}.log"
            docker run --rm --init \
              -v "$installers:/installers:ro" -v "$PWD/scripts:/scripts:ro" -v "$node_home:/opt/node:ro" \
              -e PATH=/opt/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              "$image" bash -c "bash /scripts/smoke-installer.sh $kind /installers/$pattern" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            {
              if [ "$status" -eq 0 ]; then
                echo "### Linux installer smoke test: $kind on $image passed"
              else
                echo "### Linux installer smoke test: $kind on $image FAILED"
              fi
              echo ""
              echo '```'
              grep -E '^smoke-(installer|sidecar):' "$log" | tail -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          done
          exit "$failed"

      # A failure fails the job: it passed on both Macs in the app-v2.1.0 run. See the header.
      - name: Installer smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          dmg=""
          for candidate in "${{ steps.installers-unix.outputs.dir }}"/*.dmg; do
            dmg="$candidate"
            break
          done
          case "${{ matrix.target }}" in
            x86_64-*) arch=x86_64 ;;
            *) arch=arm64 ;;
          esac
          log="${RUNNER_TEMP}/smoke-dmg.log"
          bash scripts/smoke-installer.sh dmg "$dmg" "$arch" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          {
            if [ "$status" -eq 0 ]; then
              echo "### ${{ matrix.name }} installer smoke test: passed"
            else
              echo "### ${{ matrix.name }} installer smoke test: FAILED"
              echo ""
              echo "This fails the job. Read the lines below."
            fi
            echo ""
            echo '```'
            grep -E '^smoke-(installer|sidecar):' "$log" | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Browser for the installer smoke test
        if: matrix.smoke
        run: npx playwright install chromium

      - name: Installer smoke test
        if: matrix.smoke
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-installer.ps1 -Installer "${{ steps.installers-win.outputs.installer }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shouting-iguana-${{ steps.installers-win.outputs.version || steps.installers-unix.outputs.version }}-${{ matrix.id }}
          path: ${{ steps.installers-win.outputs.dir || steps.installers-unix.outputs.dir }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The tag that started this run has to be app-v plus the version the shell is built as. A hand run never
      # gets here, so it cannot publish onto a branch.
      - name: Version from tauri.conf.json
        id: version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')"
          expected="app-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} is not ${expected}, app-v plus the version in app/src-tauri/tauri.conf.json."
            exit 1
          fi

      # For scripts/updater-manifest.mjs, which needs nothing installed.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          pattern: shouting-iguana-*
          merge-multiple: false

      # latest.json is what the app reads to learn of this version (app/src-tauri/src/updates.rs). It is written
      # before anything is published, from the files as they will be named on the release, and checked: every
      # platform is there, every URL is one of this release's files, and every signature is the app's key's over the
      # very file it names, signed as this version. A release that would update no one fails here, unpublished.
      - name: Update information (latest.json)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node app/scripts/updater-manifest.mjs expect --dir release --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --out expected-assets.json
          node app/scripts/updater-manifest.mjs write --dir release --assets expected-assets.json --version "$VERSION" \
            --notes "app/release-notes/${VERSION}.md" --out latest.json
          node app/scripts/updater-manifest.mjs check --manifest latest.json --dir release --assets expected-assets.json --version "$VERSION"
          {
            echo "### Update information"
            echo ""
            echo "latest.json, as the app reads it. Every signature was checked against the file it names."
            echo ""
            echo '```json'
            cat latest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish one release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -type f -print | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers were downloaded."
            exit 1
          fi
          names=()
          for file in "${files[@]}"; do
            names+=("$(basename "$file")")
          done
          dupes="$(printf '%s\n' "${names[@]}" | sort | uniq -d || true)"
          if [ -n "$dupes" ]; then
            echo "::error::Two artifacts share a file name, so one would replace the other on the release: ${dupes}"
            exit 1
          fi
          : > notes.md
          if [ -s "app/release-notes/${VERSION}.md" ]; then
            cat "app/release-notes/${VERSION}.md" >> notes.md
            printf '\n---\n\n' >> notes.md
          fi
          cat >> notes.md <<EOF
          Shouting Iguana ${VERSION}, from ${GITHUB_SHA}.

          The app updates itself from this release: Settings › Updates. A copy installed from the .deb package is told of the new version and downloads it. Versions 2.1.0 and older do not update themselves: download this installer once.

          No code-signing certificate was used. The Windows installer and the Linux packages are unsigned. The macOS app is ad-hoc signed and not notarised.

          Windows SmartScreen blocks the installer until it earns a reputation, and some managed machines will not run it. macOS Gatekeeper blocks the app until it is allowed in System Settings, Privacy & Security, with Open Anyway. The README has the steps.

          - Windows: per-user NSIS installer (x64), for Windows 10 and 11
          - macOS: disk image (arm64 and x64)
          - Linux: .deb and .AppImage (x64), for Ubuntu 22.04, Debian 12 and later

          Each installer is attached with a SHA256 checksum. The .sig files and latest.json are what the app's own updater reads.

          The sidecar publish does not carry ICU, because the engine does not set InvariantGlobalization. Starting it aborts without the system's libicu. The .deb gets that library through WebKitGTK, and the .AppImage bundles it with WebKit.
          EOF
          # latest.json goes up with the installers: gh publishes the release only once every file is on it, so the
          # app never finds a newest release without its update information, or update information naming a file
          # that is not there yet.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
            gh release upload "$GITHUB_REF_NAME" --clobber latest.json
            gh release edit "$GITHUB_REF_NAME" --title "Shouting Iguana ${VERSION}" --notes-file notes.md
          else
            flags=()
            case "$VERSION" in
              *-*) flags+=(--prerelease) ;;
            esac
            gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
              --title "Shouting Iguana ${VERSION}" \
              --notes-file notes.md \
              "${files[@]}" latest.json
          fi

      # The same check again, against what GitHub now holds: each URL in latest.json is a file of the release, of
      # the size that was signed, and latest.json itself is there.
      - name: Update information, as published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json assets > published-assets.json
          node app/scripts/updater-manifest.mjs check --manifest latest.json --dir release --assets published-assets.json --version "$VERSION" --published

  # A hand run has no release job. Say that once, on the summary, so it is not mistaken for a publish.
  note:
    name: Manual run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No release
        run: |
          {
            echo "### No release"
            echo ""
            echo "This run was started by hand. It builds the installers and keeps them as artifacts. It does not publish a GitHub release. A release is attached only for a push of a tag \`app-v*\`."
          } >> "$GITHUB_STEP_SUMMARY"
