# v2 desktop app release: the per-user Windows installer from the chosen ref, signed when a certificate is configured
# (the repository secrets SI_SIGN_PFX_BASE64 and SI_SIGN_PFX_PASSWORD, and optionally the variable
# SI_SIGN_TIMESTAMP_URL), smoke-tested (installed, run and uninstalled), and kept as a workflow artifact with its
# checksum, and optionally as a draft GitHub release.
#
# Run by hand only: no push to any branch releases the app. The legacy WPF app's workflow is release.yml.
name: App release (v2)

on:
  workflow_dispatch:
    inputs:
      draft-release:
        description: Also make a draft GitHub release with the installer
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # Only for the draft release.
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.4xx'

      - name: Rust
        working-directory: app/src-tauri
        run: rustup toolchain install

      # Said once, on the run's summary: an unsigned installer is blocked by SmartScreen until it earns a reputation,
      # and some managed machines won't run it at all.
      - name: Signing
        shell: pwsh
        env:
          HAS_CERTIFICATE: ${{ secrets.SI_SIGN_PFX_BASE64 != '' }}
        run: |
          if ($env:HAS_CERTIFICATE -eq 'true') {
            'The sidecar, the shell, the uninstaller and the installer are signed with the configured certificate.'
          } else {
            '::warning::No code-signing certificate is configured, so this installer is unsigned. Set the SI_SIGN_PFX_BASE64 and SI_SIGN_PFX_PASSWORD secrets before a public release.'
          }

      - run: npm ci

      # The secrets reach only the two steps that sign (after npm ci, so no package's install script sees them).
      - name: Sidecar
        env:
          SI_SIGN_PFX_BASE64: ${{ secrets.SI_SIGN_PFX_BASE64 }}
          SI_SIGN_PFX_PASSWORD: ${{ secrets.SI_SIGN_PFX_PASSWORD }}
          SI_SIGN_TIMESTAMP_URL: ${{ vars.SI_SIGN_TIMESTAMP_URL }}
        run: npm run build:sidecar -- --target x86_64-pc-windows-msvc

      - name: Release build and installer
        env:
          SI_SIGN_PFX_BASE64: ${{ secrets.SI_SIGN_PFX_BASE64 }}
          SI_SIGN_PFX_PASSWORD: ${{ secrets.SI_SIGN_PFX_PASSWORD }}
          SI_SIGN_TIMESTAMP_URL: ${{ vars.SI_SIGN_TIMESTAMP_URL }}
        run: npm run tauri build -- --bundles nsis

      - run: npx playwright install chromium

      - name: Installer smoke test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-installer.ps1

      - name: Installer and checksum
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          $sums = Join-Path $installer.DirectoryName 'SHA256SUMS.txt'
          "$hash  $($installer.Name)" | Set-Content -LiteralPath $sums -Encoding ascii
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "sums=$sums" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shouting-iguana-${{ steps.installer.outputs.version }}-windows-x64
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.sums }}
          retention-days: 30
          if-no-files-found: error

      - name: Draft release
        if: inputs.draft-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.installer.outputs.version }}
          INSTALLER: ${{ steps.installer.outputs.path }}
          SUMS: ${{ steps.installer.outputs.sums }}
        shell: pwsh
        run: |
          $flags = @('--draft')
          if ($env:VERSION.Contains('-')) { $flags += '--prerelease' }
          gh release create "app-v$env:VERSION" @flags --target $env:GITHUB_SHA `
            --title "Shouting Iguana $env:VERSION" `
            --notes "The Windows installer (per user) for Shouting Iguana $env:VERSION, from $env:GITHUB_SHA." `
            $env:INSTALLER $env:SUMS
